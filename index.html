<script>
// The phones play real snips: the camera and gallery loop theirs, and the stack player runs
// all ten in order, its progress bar and strip following along as the app's player does.
(function () {
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var N = 10, src = function (i) { return "assets/snips/s" + i + ".mp4"; };
  document.querySelectorAll("video[data-snip]").forEach(function (v) { v.src = src(v.dataset.snip); });

  var video = document.getElementById("sp-video"), bar = document.getElementById("sp-bar"), strip = document.getElementById("sp-strip");
  if (video) {
    var thumbs = [];
    for (var k = 0; k < N; k++) {
      var t = document.createElement("div");
      t.className = "thumb";
      t.innerHTML = '<img class="img" src="assets/snips/s' + k + '.jpg" alt="">';
      strip.appendChild(t);
      thumbs.push(t);
    }
    var i = 0;
    function show(n) {
      i = n % N;
      video.src = src(i);
      thumbs.forEach(function (t, j) { t.classList.toggle("on", j === i); });
      // Keep the current snip in view: the strip scrolls once past the second thumb.
      var step = strip.firstChild.getBoundingClientRect().width + parseFloat(getComputedStyle(strip).columnGap || 0);
      strip.style.transform = "translateX(" + (-Math.max(0, Math.min(i - 2, N - 6)) * step) + "px)";
      if (!reduce) video.play().catch(function () {});
    }
    video.addEventListener("ended", function () { show(i + 1); });
    video.addEventListener("timeupdate", function () {
      if (video.duration) bar.style.width = ((i + video.currentTime / video.duration) / N * 100) + "%";
    });
    show(0);
  }

  // Play only while on screen.
  var vids = [].slice.call(document.querySelectorAll(".phone video"));
  if (reduce || !("IntersectionObserver" in window)) { vids.forEach(function (v) { v.pause(); }); return; }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) e.target.play().catch(function () {}); else e.target.pause(); });
  }, { threshold: 0.2 });
  vids.forEach(function (v) { io.observe(v); });
})();
</script>
<script>
(function () {
  var mark = document.querySelector(".mark");
  var svg = mark && mark.querySelector("svg");
  if (!svg || !window.CSS || !CSS.supports("mask", "conic-gradient(#000, #000)") && !CSS.supports("-webkit-mask", "conic-gradient(#000, #000)")) return;
  var NS = "http://www.w3.org/2000/svg";
  // The app's timing: each letter starts 0.72 of a letter after the last, and one
  // pen runs the whole word on a single eased curve after a 0.3s pause.
  var SPACING = 0.72, RATE = 0.17, DELAY = 0.3;
  var ease = bezier(0.42, 0.05, 0.2, 1);

  function draw() {
    svg.textContent = "";
    var lines = [["snip", 468], ["cam", 731]];
    var measured = lines.map(function (l) {
      var t = document.createElementNS(NS, "text");
      t.textContent = l[0];
      svg.appendChild(t);
      var xs = [];
      for (var i = 0; i < l[0].length; i++) xs.push(t.getStartPositionOfChar(i).x);
      var w = t.getComputedTextLength();
      svg.removeChild(t);
      return { word: l[0], y: l[1], xs: xs, w: w };
    });
    var left = (1024 - Math.max(measured[0].w, measured[1].w)) / 2;
    var total = 7, end = (total - 1) * SPACING + 1, T = RATE * end, n = 0;
    measured.forEach(function (m) {
      for (var i = 0; i < m.word.length; i++, n++) {
        var t = document.createElementNS(NS, "text");
        t.textContent = m.word[i];
        t.setAttribute("x", left + m.xs[i]);
        t.setAttribute("y", m.y);
        var start = timeAt(n * SPACING / end), stop = timeAt(Math.min(n * SPACING + 1, end) / end);
        t.style.setProperty("--delay", (DELAY + start * T).toFixed(3) + "s");
        t.style.setProperty("--dur", Math.max((stop - start) * T, 0.05).toFixed(3) + "s");
        svg.appendChild(t);
      }
    });
  }

  // Invert the easing curve: when does the pen reach progress p?
  function timeAt(p) {
    var lo = 0, hi = 1;
    for (var k = 0; k < 30; k++) { var mid = (lo + hi) / 2; if (ease(mid) < p) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  }
  function bezier(x1, y1, x2, y2) {
    function c(a, b, t) { return 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t; }
    return function (x) {
      var lo = 0, hi = 1;
      for (var k = 0; k < 30; k++) { var mid = (lo + hi) / 2; if (c(x1, x2, mid) < x) lo = mid; else hi = mid; }
      return c(y1, y2, (lo + hi) / 2);
    };
  }

  function play() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    mark.classList.remove("play");
    void mark.offsetWidth;
    mark.classList.add("play");
  }

  // Start once the font and the glass tile are both ready, so nothing pops in mid-animation.
  var glass = mark.querySelector(".glass");
  Promise.all([
    document.fonts ? document.fonts.ready : null,
    new Promise(function (done) {
      if (glass.complete) return done();
      glass.addEventListener("load", done);
      glass.addEventListener("error", done);
    })
  ]).then(function () {
    // Measuring needs the drawing shown; it stays empty until the letters are in.
    mark.classList.add("live");
    try { draw(); } catch (e) { mark.classList.remove("live"); return; }
    play();
  });
  mark.addEventListener("click", play);
})();
</script>
