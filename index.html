<style>
  :root { --bg: #f6f1e8; --ink: #1d1b18; --muted: #6f685e; --cta: #1d1b18; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141311; --ink: #f4efe6; --muted: #a49c90; --cta: #f4efe6; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  main { flex: 1; display: grid; place-items: center; text-align: center; padding: 48px 22px; }
  .app-icon { width: 112px; height: 112px; border-radius: 26px; margin: 0 auto 26px; box-shadow: 0 10px 30px rgba(0, 0, 0, .12); display: block; }
  /* The app's launch mark: the glass tile sharpens, its rings sweep round, then snip and cam are written in. */
  @property --sweep { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .mark { --side: 112px; position: relative; width: var(--side); height: var(--side); margin: 0 auto 26px; border-radius: 22.37%; box-shadow: 0 6px 28px rgba(0, 0, 0, .12); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mark .tile { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; isolation: isolate; }
  .mark .static { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mark .glass, .mark .rings, .mark .glow, .mark svg { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .mark.live .static { display: none; }
  .mark.live .glass, .mark.live .rings, .mark.live .glow, .mark.live svg { display: block; }
  .mark .glass { filter: blur(calc(var(--side) * .07)) saturate(0); }
  .mark .rings { --sweep: 107%; -webkit-mask: conic-gradient(#000 calc(var(--sweep) - 7%), transparent var(--sweep)); mask: conic-gradient(#000 calc(var(--sweep) - 7%), transparent var(--sweep)); }
  .mark .glow { --sweep: 120%; opacity: 0; -webkit-mask: conic-gradient(#000 calc(var(--sweep) - 20%), transparent var(--sweep)); mask: conic-gradient(#000 calc(var(--sweep) - 20%), transparent var(--sweep)); }
  .mark .glow i { position: absolute; inset: 10.16%; border-radius: 10.74%; padding: calc(var(--side) * .04); filter: blur(calc(var(--side) * .022));
    background: conic-gradient(from calc(90deg + var(--spin)), hsl(342 100% 89%), hsl(22 100% 89%), hsl(50 100% 89%), hsl(119 100% 89%), hsl(198 100% 89%), hsl(259 100% 89%), hsl(342 100% 89%));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .mark text { font: 700 360px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; letter-spacing: -7.9px; fill: #211d18; stroke: #211d18; stroke-width: 12.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2600; }
  .mark.play .glass, .mark.play .rings { animation: glass-in .3s cubic-bezier(.3, .05, .2, 1) both; }
  .mark.play .rings { animation: glass-in .3s cubic-bezier(.3, .05, .2, 1) both, sweep-rings .6s cubic-bezier(.45, 0, .25, 1) .04s both; }
  .mark.play .glow { animation: sweep-glow .6s cubic-bezier(.45, 0, .25, 1) .04s both, glow 1.4s linear both; }
  .mark.play .glow i { animation: spin 1.5s ease-in-out both; }
  .mark.play text { animation: pen var(--dur) linear var(--delay) both; }
  @keyframes glass-in { from { opacity: 0; transform: scale(1.08); } }
  @keyframes sweep-rings { from { --sweep: 0%; } }
  @keyframes sweep-glow { from { --sweep: 0%; } }
  @keyframes spin { from { --spin: 0deg; } to { --spin: 180deg; } }
  @keyframes glow { 0% { opacity: 0; } 18% { opacity: .35; } 50% { opacity: .35; } 100% { opacity: 0; } }
  @keyframes pen {
    0% { stroke-dashoffset: 2600; fill-opacity: 0; stroke-opacity: 1; }
    40% { fill-opacity: 0; }
    78% { stroke-opacity: 1; }
    85% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0; }
  }
  .mark:not(.play) text { stroke-opacity: 0; }
  h1 { font-size: clamp(40px, 8vw, 64px); line-height: 1.05; letter-spacing: -.03em; margin: 0; font-weight: 700; }

  .cta { display: inline-block; margin-top: 32px; padding: 15px 28px; border-radius: 999px; background: var(--cta); color: var(--bg); text-decoration: none; font-weight: 600; font-size: 17px; }
  .cta:hover { opacity: .88; }

  footer { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; padding: 22px; font-size: 14px; color: var(--muted); }
  footer a { color: inherit; }
  main { display: block; padding: 64px 22px 48px; }
  .screens { max-width: 960px; margin: 80px auto 0; }
  .eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 600; }
  h2 { font-size: clamp(28px, 5vw, 40px); line-height: 1.15; letter-spacing: -.025em; margin: 12px 0; }
  .screen-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; max-width: 920px; margin: 40px auto 0; }
  figure { margin: 0; min-width: 0; }
  .screen-grid img, .screen-grid video { display: block; width: 100%; height: auto; border-radius: 32px; box-shadow: 0 18px 40px rgba(0,0,0,.18); border: 5px solid #24231f; }
  figcaption { font-size: 14px; color: var(--muted); margin: 22px 0 0; }
  figcaption strong { color: var(--ink); font-size: 17px; }
  a:focus-visible { outline: 3px solid #b88b4c; outline-offset: 5px; }
  /* The capture, to try: hold the finder as in the app. */
  .try-phone { position: relative; aspect-ratio: 1206 / 2622; border-radius: 32px; border: 5px solid #24231f; background: var(--bg); box-shadow: 0 18px 40px rgba(0,0,0,.18); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .try-finder { --r: 26px; position: absolute; left: 4%; right: 4%; top: 8.5%; bottom: 12.5%; border-radius: var(--r); overflow: hidden; cursor: pointer; touch-action: none; outline: none; background: #2b2723; transition: transform .25s cubic-bezier(.3,.7,.3,1); }
  .try-finder.down { transform: scale(.985); }
  .try-finder:focus-visible { box-shadow: 0 0 0 3px #b88b4c; }
  .try-finder img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
  .try-band { --inset: 0px; --thick: 6px; --on: 0; --sweep: 0%; position: absolute; inset: var(--inset); border-radius: max(4px, calc(var(--r) - var(--inset))); padding: var(--thick); opacity: var(--on); pointer-events: none;
    -webkit-backdrop-filter: blur(3px) saturate(1.7) brightness(1.1); backdrop-filter: blur(3px) saturate(1.7) brightness(1.1);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .try-band i { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.9) 46%, transparent 54%, transparent 70%, rgba(255,255,255,.5) 75%, transparent 80%) no-repeat; background-size: 300% 300%; background-position: var(--sweep) var(--sweep); mix-blend-mode: plus-lighter; }
  .try-gather { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; }
  .try-dock { position: absolute; left: 50%; bottom: 3.2%; transform: translateX(-50%); width: 62%; height: 6.2%; border-radius: 999px; background: rgba(255,255,255,.75); box-shadow: 0 4px 16px rgba(0,0,0,.08); display: flex; align-items: center; justify-content: space-around; color: #1d1b18; }
  @media (prefers-color-scheme: dark) { .try-dock { background: rgba(255,255,255,.12); color: #f4efe6; } }
  .try-dock svg { width: 22%; height: 46%; }
  .try-dock .stack { transition: transform .3s cubic-bezier(.3,1.6,.4,1); }
  .try-dock .stack.got { transform: scale(1.25) translateY(-2px); }
  .try-drop { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #1d1b18; opacity: 0; pointer-events: none; }
  @media (prefers-color-scheme: dark) { .try-drop { background: #f4efe6; } }
  @media(max-width: 640px) {
    .screen-grid { grid-template-columns: 1fr; max-width: 300px; gap: 36px; }
    .screen-grid img, .screen-grid video { border-radius: 28px; border-width: 4px; }
    figcaption { margin-top: 14px; }
    .screens { margin-top: 64px; }
  }

<script>
(function () {
  var mark = document.querySelector(".mark");
  var svg = mark && mark.querySelector("svg");
  if (!svg || !window.CSS || !CSS.supports("mask", "conic-gradient(#000, #000)") && !CSS.supports("-webkit-mask", "conic-gradient(#000, #000)")) return;
  var NS = "http://www.w3.org/2000/svg";
  // The app's timing: each letter starts 0.72 of a letter after the last, and one
  // pen runs the whole word on a single eased curve after a 0.3s pause.
  var SPACING = 0.72, RATE = 0.17, DELAY = 0.3;
  var ease = bezier(0.42, 0.05, 0.2, 1);

  function draw() {
    svg.textContent = "";
    var lines = [["snip", 468], ["cam", 731]];
    var measured = lines.map(function (l) {
      var t = document.createElementNS(NS, "text");
      t.textContent = l[0];
      svg.appendChild(t);
      var xs = [];
      for (var i = 0; i < l[0].length; i++) xs.push(t.getStartPositionOfChar(i).x);
      var w = t.getComputedTextLength();
      svg.removeChild(t);
      return { word: l[0], y: l[1], xs: xs, w: w };
    });
    var left = (1024 - Math.max(measured[0].w, measured[1].w)) / 2;
    var total = 7, end = (total - 1) * SPACING + 1, T = RATE * end, n = 0;
    measured.forEach(function (m) {
      for (var i = 0; i < m.word.length; i++, n++) {
        var t = document.createElementNS(NS, "text");
        t.textContent = m.word[i];
        t.setAttribute("x", left + m.xs[i]);
        t.setAttribute("y", m.y);
        var start = timeAt(n * SPACING / end), stop = timeAt(Math.min(n * SPACING + 1, end) / end);
        t.style.setProperty("--delay", (DELAY + start * T).toFixed(3) + "s");
        t.style.setProperty("--dur", Math.max((stop - start) * T, 0.05).toFixed(3) + "s");
        svg.appendChild(t);
      }
    });
  }

  // Invert the easing curve: when does the pen reach progress p?
  function timeAt(p) {
    var lo = 0, hi = 1;
    for (var k = 0; k < 30; k++) { var mid = (lo + hi) / 2; if (ease(mid) < p) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  }
  function bezier(x1, y1, x2, y2) {
    function c(a, b, t) { return 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t; }
    return function (x) {
      var lo = 0, hi = 1;
      for (var k = 0; k < 30; k++) { var mid = (lo + hi) / 2; if (c(x1, x2, mid) < x) lo = mid; else hi = mid; }
      return c(y1, y2, (lo + hi) / 2);
    };
  }

  function play() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    mark.classList.remove("play");
    void mark.offsetWidth;
    mark.classList.add("play");
  }

  // Start once the font and the glass tile are both ready, so nothing pops in mid-animation.
  var glass = mark.querySelector(".glass");
  Promise.all([
    document.fonts ? document.fonts.ready : null,
    new Promise(function (done) {
      if (glass.complete) return done();
      glass.addEventListener("load", done);
      glass.addEventListener("error", done);
    })
  ]).then(function () {
    // Measuring needs the drawing shown; it stays empty until the letters are in.
    mark.classList.add("live");
    try { draw(); } catch (e) { mark.classList.remove("live"); return; }
    play();
  });
  mark.addEventListener("click", play);
})();
</script>
<script>
// The capture, as the app does it. Hold the finder: a band of glass forms on
// its border and swells inward with the haptic's own curve, while a light streak slides across it. Hold
// for the snip's three seconds and the picture gathers and falls into the
// Stack tab, as in the app. Let go early and nothing is kept.
(function () {
  var finder = document.getElementById("try-finder");
  if (!finder) return;
  var phone = finder.parentElement;
  var band = finder.querySelector(".try-band");
  var gather = finder.querySelector(".try-gather");
  var drop = phone.querySelector(".try-drop");
  var stack = phone.querySelector(".try-dock .stack");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var HOLD = 3, holding = false, busy = false, start = 0, raf = 0;

  function smooth(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  // The recording haptic: 0.22, up to 0.68 at 45% of the swell, down to 0.16.
  function swell(t) {
    var L = Math.min(Math.max(HOLD * 0.42, 0.72), 1.15), pk = L * 0.45;
    if (t <= 0) return 0.22;
    if (t < pk) return 0.22 + 0.46 * t / pk;
    if (t < L) return 0.68 - 0.52 * (t - pk) / (L - pk);
    return 0.16;
  }
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

  function frame(now) {
    var t = (now - start) / 1000, p = Math.min(t / HOLD, 1);
    // The app's points, scaled to this finder's width.
    var k = finder.clientWidth / 370;
    var reach = 4 + 22 * (reduce ? 0.3 : swell(t - 0.15)) + 4 * smooth(p);
    band.style.setProperty("--thick", ((5 + reach * 0.6) * k).toFixed(2) + "px");
    band.style.setProperty("--on", smooth(t / 0.2).toFixed(3));
    band.style.setProperty("--sweep", (reduce ? 50 : 100 - (t / 3.2 % 1) * 100).toFixed(1) + "%");
    if (p >= 1) return release();
    raf = requestAnimationFrame(frame);
  }

  function begin(e) {
    if (holding || busy) return;
    if (e && e.pointerId !== undefined) finder.setPointerCapture(e.pointerId);
    holding = true;
    finder.classList.add("down");
    start = performance.now();
    buzz(12);
    raf = requestAnimationFrame(frame);
  }
  function end() {
    if (!holding) return;
    holding = false;
    cancelAnimationFrame(raf);
    finder.classList.remove("down");
    band.animate([{ opacity: getComputedStyle(band).opacity }, { opacity: 0 }], { duration: 160, easing: "ease-out" });
    band.style.setProperty("--on", "0");
  }

  // The snip is kept: the picture gathers toward the bottom of the finder
  // with a soft edge and falls into the Stack tab as one drop.
  function release() {
    holding = false;
    busy = true;
    finder.classList.remove("down");
    band.style.setProperty("--on", "0");
    buzz([18, 40, 12]);
    var f = finder.getBoundingClientRect(), ph = phone.getBoundingClientRect(), s = stack.getBoundingClientRect();
    var exitX = f.width / 2 - f.width * 0.26, exitY = f.height - f.width * 0.08;
    var ms = reduce ? 1 : 1;
    gather.style.opacity = "1";
    var mask = function (r) { return "radial-gradient(circle at " + exitX + "px " + exitY + "px, #000 " + Math.max(0, r - 26) + "px, transparent " + r + "px)"; };
    var big = Math.hypot(f.width, f.height) * 1.1;
    var g = gather.animate([
      { WebkitMaskImage: mask(big), maskImage: mask(big) },
      { WebkitMaskImage: mask(big), maskImage: mask(big), offset: 0.1 },
      { WebkitMaskImage: mask(8), maskImage: mask(8) }
    ], { duration: reduce ? 1 : 620 * ms, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" });
    g.onfinish = function () {
      gather.style.opacity = "0";
      var x0 = f.left - ph.left + exitX, y0 = f.top - ph.top + exitY;
      var x1 = s.left - ph.left + s.width / 2, y1 = s.top - ph.top + s.height / 2;
      var d = drop.animate([
        { left: x0 + "px", top: y0 + "px", opacity: 1, transform: "scale(1)" },
        { left: x1 + "px", top: y1 + "px", opacity: 1, transform: "scale(.7)", offset: 0.85 },
        { left: x1 + "px", top: y1 + "px", opacity: 0, transform: "scale(.4)" }
      ], { duration: reduce ? 1 : 360, easing: "cubic-bezier(.5,0,.3,1)" });
      d.onfinish = function () {
        stack.classList.add("got");
        setTimeout(function () { stack.classList.remove("got"); busy = false; }, 320);
      };
    };
  }

  finder.addEventListener("pointerdown", function (e) { e.preventDefault(); begin(e); });
  finder.addEventListener("pointerup", end);
  finder.addEventListener("pointercancel", end);
  finder.addEventListener("lostpointercapture", end);
  finder.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  finder.addEventListener("keydown", function (e) { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); begin(); } });
  finder.addEventListener("keyup", function (e) { if (e.key === " " || e.key === "Enter") end(); });
})();
</script>
