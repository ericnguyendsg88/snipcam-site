<style>
  :root { --bg: #f6f1e8; --ink: #1d1b18; --muted: #6f685e; --cta: #1d1b18; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141311; --ink: #f4efe6; --muted: #a49c90; --cta: #f4efe6; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  main { flex: 1; display: grid; place-items: center; text-align: center; padding: 48px 22px; }
  .app-icon { width: 112px; height: 112px; border-radius: 26px; margin: 0 auto 26px; box-shadow: 0 10px 30px rgba(0, 0, 0, .12); display: block; }
  /* The app's launch mark: the glass tile sharpens, its rings sweep round, then snip and cam are written in. */
  @property --sweep { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .mark { --side: 112px; position: relative; width: var(--side); height: var(--side); margin: 0 auto 26px; border-radius: 22.37%; box-shadow: 0 6px 28px rgba(0, 0, 0, .12); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mark .tile { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; isolation: isolate; }
  .mark .static { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mark .glass, .mark .rings, .mark .glow, .mark svg { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .mark.live .static { display: none; }
  .mark.live .glass, .mark.live .rings, .mark.live .glow, .mark.live svg { display: block; }
  .mark .glass { filter: blur(calc(var(--side) * .07)) saturate(0); }
  .mark .rings { --sweep: 107%; -webkit-mask: conic-gradient(#000 calc(var(--sweep) - 7%), transparent var(--sweep)); mask: conic-gradient(#000 calc(var(--sweep) - 7%), transparent var(--sweep)); }
  .mark .glow { --sweep: 120%; opacity: 0; -webkit-mask: conic-gradient(#000 calc(var(--sweep) - 20%), transparent var(--sweep)); mask: conic-gradient(#000 calc(var(--sweep) - 20%), transparent var(--sweep)); }
  .mark .glow i { position: absolute; inset: 10.16%; border-radius: 10.74%; padding: calc(var(--side) * .04); filter: blur(calc(var(--side) * .022));
    background: conic-gradient(from calc(90deg + var(--spin)), hsl(342 100% 89%), hsl(22 100% 89%), hsl(50 100% 89%), hsl(119 100% 89%), hsl(198 100% 89%), hsl(259 100% 89%), hsl(342 100% 89%));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .mark text { font: 700 360px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; letter-spacing: -7.9px; fill: #211d18; stroke: #211d18; stroke-width: 12.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2600; }
  .mark.play .glass, .mark.play .rings { animation: glass-in .3s cubic-bezier(.3, .05, .2, 1) both; }
  .mark.play .rings { animation: glass-in .3s cubic-bezier(.3, .05, .2, 1) both, sweep-rings .6s cubic-bezier(.45, 0, .25, 1) .04s both; }
  .mark.play .glow { animation: sweep-glow .6s cubic-bezier(.45, 0, .25, 1) .04s both, glow 1.4s linear both; }
  .mark.play .glow i { animation: spin 1.5s ease-in-out both; }
  .mark.play text { animation: pen var(--dur) linear var(--delay) both; }
  @keyframes glass-in { from { opacity: 0; transform: scale(1.08); } }
  @keyframes sweep-rings { from { --sweep: 0%; } }
  @keyframes sweep-glow { from { --sweep: 0%; } }
  @keyframes spin { from { --spin: 0deg; } to { --spin: 180deg; } }
  @keyframes glow { 0% { opacity: 0; } 18% { opacity: .35; } 50% { opacity: .35; } 100% { opacity: 0; } }
  @keyframes pen {
    0% { stroke-dashoffset: 2600; fill-opacity: 0; stroke-opacity: 1; }
    40% { fill-opacity: 0; }
    78% { stroke-opacity: 1; }
    85% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0; }
  }
  .mark:not(.play) text { stroke-opacity: 0; }
  h1 { font-size: clamp(40px, 8vw, 64px); line-height: 1.05; letter-spacing: -.03em; margin: 0; font-weight: 700; }

  footer { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; padding: 22px; font-size: 14px; color: var(--muted); }

  main { display: block; padding: 64px 22px 48px; }
  .screens { max-width: 1040px; margin: 80px auto 0; }

  h2 { font-size: clamp(28px, 5vw, 40px); line-height: 1.15; letter-spacing: -.025em; margin: 12px 0; }
  .screen-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 36px 24px; max-width: 920px; margin: 40px auto 0; }
  figure { margin: 0; min-width: 0; flex: 0 0 calc((100% - 48px) / 3); }
  .screen-grid img, .screen-grid video { display: block; width: 100%; height: auto; border-radius: 32px; box-shadow: 0 18px 40px rgba(0,0,0,.18); border: 5px solid #24231f; }
  figcaption { font-size: 14px; color: var(--muted); margin: 22px 0 0; }
  figcaption strong { color: var(--ink); font-size: 17px; }
  a:focus-visible { outline: 3px solid #b88b4c; outline-offset: 5px; }
  .feedback { max-width: 520px; margin: 96px auto 0; text-align: left; }
  .feedback h2 { text-align: center; }
  .fb-kind { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 28px 0 14px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .fb-kind label { position: relative; text-align: center; padding: 9px 0; border-radius: 999px; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; }
  .fb-kind input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .fb-kind label:has(input:checked) { background: var(--bg); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.14); }
  .fb-kind label:has(input:focus-visible) { outline: 3px solid #b88b4c; outline-offset: 2px; }
  .feedback textarea, .feedback input[type=email] { display: block; width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; resize: vertical; }
  .feedback textarea { min-height: 132px; }
  .feedback textarea::placeholder, .feedback input::placeholder { color: var(--muted); }
  .feedback textarea:focus-visible, .feedback input:focus-visible { outline: 3px solid #b88b4c; outline-offset: 2px; }
  .feedback .cta { display: block; width: 100%; margin-top: 4px; border: 0; font: inherit; font-weight: 600; cursor: pointer; }
  .feedback .cta:disabled { opacity: .5; cursor: default; }
  .fb-note { text-align: center; font-size: 15px; margin-top: 14px; min-height: 1.5em; }
  .fb-hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  @media(max-width: 640px) {

    figure { flex-basis: 100%; }
    .screen-grid img, .screen-grid video { border-radius: 28px; border-width: 4px; }
    figcaption { margin-top: 14px; }
    .screens { margin-top: 64px; }
  }
</style>

<script>
(function () {
  var mark = document.querySelector(".mark");
  var svg = mark && mark.querySelector("svg");
  if (!svg || !window.CSS || !CSS.supports("mask", "conic-gradient(#000, #000)") && !CSS.supports("-webkit-mask", "conic-gradient(#000, #000)")) return;
  var NS = "http://www.w3.org/2000/svg";
  // The app's timing: each letter starts 0.72 of a letter after the last, and one
  // pen runs the whole word on a single eased curve after a 0.3s pause.
  var SPACING = 0.72, RATE = 0.17, DELAY = 0.3;
  var ease = bezier(0.42, 0.05, 0.2, 1);

  function draw() {
    svg.textContent = "";
    var lines = [["snip", 468], ["cam", 731]];
    var measured = lines.map(function (l) {
      var t = document.createElementNS(NS, "text");
      t.textContent = l[0];
      svg.appendChild(t);
      var xs = [];
      for (var i = 0; i < l[0].length; i++) xs.push(t.getStartPositionOfChar(i).x);
      var w = t.getComputedTextLength();
      svg.removeChild(t);
      return { word: l[0], y: l[1], xs: xs, w: w };
    });
    var left = (1024 - Math.max(measured[0].w, measured[1].w)) / 2;
    var total = 7, end = (total - 1) * SPACING + 1, T = RATE * end, n = 0;
    measured.forEach(function (m) {
      for (var i = 0; i < m.word.length; i++, n++) {
        var t = document.createElementNS(NS, "text");
        t.textContent = m.word[i];
        t.setAttribute("x", left + m.xs[i]);
        t.setAttribute("y", m.y);
        var start = timeAt(n * SPACING / end), stop = timeAt(Math.min(n * SPACING + 1, end) / end);
        t.style.setProperty("--delay", (DELAY + start * T).toFixed(3) + "s");
        t.style.setProperty("--dur", Math.max((stop - start) * T, 0.05).toFixed(3) + "s");
        svg.appendChild(t);
      }
    });
  }

  // Invert the easing curve: when does the pen reach progress p?
  function timeAt(p) {
    var lo = 0, hi = 1;
    for (var k = 0; k < 30; k++) { var mid = (lo + hi) / 2; if (ease(mid) < p) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  }
  function bezier(x1, y1, x2, y2) {
    function c(a, b, t) { return 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t; }
    return function (x) {
      var lo = 0, hi = 1;
      for (var k = 0; k < 30; k++) { var mid = (lo + hi) / 2; if (c(x1, x2, mid) < x) lo = mid; else hi = mid; }
      return c(y1, y2, (lo + hi) / 2);
    };
  }

  function play() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    mark.classList.remove("play");
    void mark.offsetWidth;
    mark.classList.add("play");
  }

  // Start once the font and the glass tile are both ready, so nothing pops in mid-animation.
  var glass = mark.querySelector(".glass");
  Promise.all([
    document.fonts ? document.fonts.ready : null,
    new Promise(function (done) {
      if (glass.complete) return done();
      glass.addEventListener("load", done);
      glass.addEventListener("error", done);
    })
  ]).then(function () {
    // Measuring needs the drawing shown; it stays empty until the letters are in.
    mark.classList.add("live");
    try { draw(); } catch (e) { mark.classList.remove("live"); return; }
    play();
  });
  mark.addEventListener("click", play);
})();
</script>
<script>

      .then(function () { btn.disabled = false; });
  });
})();
</script>
